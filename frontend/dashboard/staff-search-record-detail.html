<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DBShield - Patient Information</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="detail">
    <div class="db-layout db-layout--detail">
      <aside class="sidebar">
        <div class="sidebar__brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3.25 18.5 6v5.15c0 4.28-2.64 7.83-6.5 9.6-3.86-1.77-6.5-5.32-6.5-9.6V6L12 3.25Z"></path>
            </svg>
          </span>
          <span>
            <strong>DBShield</strong>
            <small id="portal-label">Staff Portal</small>
            <small class="sidebar-user-level" id="sidebar-user-level">Clearance Level -</small>
          </span>
        </div>

        <nav class="side-nav" aria-label="Main navigation">
          <a class="side-nav__item" href="staff-dashboard.html" id="dashboard-link">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1"></rect>
              <rect x="14" y="4" width="6" height="6" rx="1"></rect>
              <rect x="4" y="14" width="6" height="6" rx="1"></rect>
              <rect x="14" y="14" width="6" height="6" rx="1"></rect>
            </svg>
            Dashboard
          </a>
          <a class="side-nav__item side-nav__item--active" href="staff-search-record-detail.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h7l3 3v15H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path>
              <path d="M13 3v4h4"></path>
              <path d="M9 13h6"></path>
              <path d="M9 17h5"></path>
            </svg>
            Client Info
          </a>
        </nav>

        <a class="logout" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
          Log Out
        </a>
      </aside>

      <main class="content content--detail">
        <header class="detail-title">
          <div>
            <h1>Patient Information</h1>
            <p id="detail-subtitle">Loading patient record...</p>
          </div>
          <a class="secondary-button" href="staff-search.html" id="back-to-search">Back to Search</a>
        </header>

        <section class="info-card">
          <div class="info-card__header">
            <h2>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3"></circle>
                <path d="M6 21v-2a6 6 0 0 1 12 0v2"></path>
              </svg>
              Personal Information
            </h2>
            <button class="soft-button" type="button" id="detail-edit-button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"></path>
              </svg>
              Edit
            </button>
          </div>

          <p class="detail-message" id="detail-edit-message" role="status"></p>

          <div class="form-grid">
            <label>
              <span>Patient ID</span>
              <input id="detail-patient-id" type="text" value="" readonly>
            </label>
            <label>
              <span>Full Name</span>
              <input id="detail-full-name" type="text" value="" readonly>
            </label>
            <label>
              <span>Date of Birth</span>
              <input id="detail-dob" type="text" value="" readonly>
            </label>
            <label>
              <span class="label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.6 2.6a2 2 0 0 1-.45 2.11L8.9 10.68a16 16 0 0 0 4.42 4.42l1.25-1.25a2 2 0 0 1 2.11-.45c.83.28 1.7.48 2.6.6A2 2 0 0 1 22 16.92Z"></path>
                </svg>
                Contact Number
              </span>
              <input id="detail-contact" type="text" value="" readonly>
            </label>
            <label>
              <span class="label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
                Email Address
              </span>
              <input id="detail-email" type="text" value="" readonly>
            </label>
          </div>
        </section>

        <section class="info-card">
          <div class="info-card__header info-card__header--plain">
            <h2>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <path d="M16 2v4"></path>
                <path d="M8 2v4"></path>
                <path d="M3 10h18"></path>
              </svg>
              Medical Information
            </h2>
          </div>

          <div class="form-grid">
            <label>
              <span>Primary Physician</span>
              <input id="detail-doctor" type="text" value="" readonly>
            </label>
            <label>
              <span>Department</span>
              <input id="detail-department" class="input-small" type="text" value="" readonly>
            </label>
            <label>
              <span>Last Visit Date</span>
              <input id="detail-last-visit" type="text" value="" readonly>
            </label>
            <label>
              <span>Medical Notes</span>
              <textarea id="detail-notes" readonly>No notes available</textarea>
            </label>
          </div>
        </section>
      </main>
    </div>
      <script src="app.js?v=20260805-level"></script>
  </body>
</html>
